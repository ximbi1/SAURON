apiVersion: v1
kind: Namespace
metadata:
  name: sauron-m8b
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: m8b-multi
  namespace: sauron-m8b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: m8b-multi
  template:
    metadata:
      labels:
        app: m8b-multi
    spec:
      containers:
        - name: web
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
        - name: sidecar
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
