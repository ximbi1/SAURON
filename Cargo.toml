[package]
name = "sauron"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "An evidence-driven Kubernetes terminal operations console"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", features = ["io"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
kube = { version = "4.2", default-features = false, features = ["client", "runtime", "rustls-tls", "ring", "http-proxy", "ws"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "crossterm_0_29", "layout-cache"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true

[[bench]]
name = "pipeline"
harness = false
