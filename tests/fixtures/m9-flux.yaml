apiVersion: v1
kind: Namespace
metadata:
  name: sauron-m9
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: podinfo
  namespace: sauron-m9
spec:
  interval: 1m
  url: https://github.com/stefanprodan/podinfo
  ref:
    branch: master
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podinfo-kustomize
  namespace: sauron-m9
spec:
  interval: 1m
  path: ./kustomize
  prune: true
  sourceRef:
    kind: GitRepository
    name: podinfo
  targetNamespace: sauron-m9
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: podinfo
  namespace: sauron-m9
spec:
  interval: 1m
  url: https://stefanprodan.github.io/podinfo
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo-helm
  namespace: sauron-m9
spec:
  interval: 1m
  chart:
    spec:
      chart: podinfo
      sourceRef:
        kind: HelmRepository
        name: podinfo
        namespace: sauron-m9
  values:
    replicaCount: 1
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
---
# A Kustomization that deliberately depends on another, and on a source
# that does not exist -- used by both interactive/live evidence and
# fixtures for "missing referenced source" / "dependsOn" coverage,
# without needing a second real Git repository.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podinfo-dependent
  namespace: sauron-m9
spec:
  interval: 1m
  path: ./kustomize
  prune: true
  suspend: true
  dependsOn:
    - name: podinfo-kustomize
  sourceRef:
    kind: GitRepository
    name: podinfo-missing
  targetNamespace: sauron-m9
