apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: master
    path: guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: sauron-m9
  syncPolicy: {}
---
# A second Application with automated sync + a target revision that does
# not exist, for "sync status/health distinct" and controller-reported
# error condition coverage without needing a second real Git repository.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-broken
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: this-branch-does-not-exist
    path: guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: sauron-m9
  syncPolicy: {}
