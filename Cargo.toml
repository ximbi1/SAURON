[package]
# crates.io's own "sauron" name is already taken by an unrelated web
# framework (published since 2019) -- "saur-on" is only the crates.io
# publish identifier. The actual binary/lib crate name stays "sauron"
# (see [lib]/[[bin]] below and src/brand.rs), so nothing else -- config
# directory, docs, scripts, `use sauron::` imports -- needs to change.
name = "saur-on"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "An evidence-driven Kubernetes terminal operations console"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ximbi1/SAURON"
readme = "README.md"
keywords = ["kubernetes", "tui", "terminal", "k8s", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "sauron"

[[bin]]
name = "sauron"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", features = ["io"] }
http = "1"
http-body-util = "0.1"
k8s-openapi = { version = "0.28", features = ["v1_32"] }
kube = { version = "4.2", default-features = false, features = ["client", "runtime", "rustls-tls", "ring", "http-proxy", "ws"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "crossterm_0_29", "layout-cache"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util", "io-std", "fs", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
# Process-group termination only: kill(-pid, SIGKILL) has no safe std
# equivalent. Nothing else in this codebase uses libc directly.
libc = "0.2"

[profile.release]
lto = "thin"
strip = true

[[bench]]
name = "pipeline"
harness = false
