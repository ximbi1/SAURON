apiVersion: v1
kind: Namespace
metadata:
  name: sauron-m6
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: m6-config
  namespace: sauron-m6
data:
  setting: fixture-only
---
apiVersion: v1
kind: Secret
metadata:
  name: m6-secret
  namespace: sauron-m6
type: Opaque
stringData:
  fixture: not-a-credential
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: m6-sa
  namespace: sauron-m6
---
apiVersion: v1
kind: Service
metadata:
  name: m6-web
  namespace: sauron-m6
spec:
  selector:
    app: m6-web
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Secret
metadata:
  name: m6-tls-fixture
  namespace: sauron-m6
type: Opaque
stringData:
  fixture: relationship-only-not-a-certificate
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: m6-web
  namespace: sauron-m6
spec:
  defaultBackend:
    service:
      name: m6-web
      port:
        number: 8080
  tls:
    - secretName: m6-tls-fixture
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: m6-data
  namespace: sauron-m6
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: m6-web
  namespace: sauron-m6
spec:
  replicas: 1
  selector:
    matchLabels:
      app: m6-web
  template:
    metadata:
      labels:
        app: m6-web
    spec:
      serviceAccountName: m6-sa
      automountServiceAccountToken: false
      initContainers:
        - name: initialize
          image: busybox:1.37
          command: ["sh", "-c", "exit 0"]
          envFrom:
            - configMapRef:
                name: m6-config
      containers:
        - name: app
          image: busybox:1.37
          command: ["sleep", "86400"]
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              memory: 32Mi
          env:
            - name: FIXTURE
              valueFrom:
                secretKeyRef:
                  name: m6-secret
                  key: fixture
          volumeMounts:
            - name: configuration
              mountPath: /fixture
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: configuration
          projected:
            sources:
              - configMap:
                  name: m6-config
              - secret:
                  name: m6-secret
        - name: data
          persistentVolumeClaim:
            claimName: m6-data
