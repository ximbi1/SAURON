name: Release artifacts
# M12.5: builds the 4-platform packaging matrix docs/M12_ACCEPTANCE.md
# defines. Manual trigger only (`workflow_dispatch`) -- never runs on push
# or pull_request, so it can never fire without someone explicitly
# clicking "Run workflow" (or an authorized `gh workflow run`). This
# workflow has never been executed as of the commit that adds it; see
# docs/M12_ACCEPTANCE.md's own M12.0/M12.5 journal entries for why (no
# rustup/cross-linker/macOS hardware on the development machine, and
# publishing/triggering CI beyond what was already authorized for
# main/tags needs its own explicit go-ahead).
#
# The `publish_release` job creates a GitHub Release as a DRAFT
# (`draft: true`, fixed, not an input) -- it is never auto-published. A
# human must open the draft in the GitHub UI and click "Publish release"
# before it becomes visible to the public or linkable from anywhere.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross linker (Linux aarch64 only)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          bash scripts/package.sh ${{ matrix.target }} target/${{ matrix.target }}/release/sauron
      - name: Basic acceptance (native targets only)
        # A cross-compiled aarch64 binary cannot run on an x86_64 runner --
        # this step only proves the archive is sane and the binary is
        # actually executable where the runner's own architecture matches.
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-apple-darwin'
        run: |
          set -euo pipefail
          version="$(grep '^version = ' Cargo.toml | head -1 | sed -E 's/version = "(.*)"/\1/')"
          dir="target/package/sauron-${version}-${{ matrix.target }}"
          "$dir/sauron" --version
          "$dir/sauron" info --offline
      - uses: actions/upload-artifact@v4
        with:
          name: sauron-${{ matrix.target }}
          path: target/dist/*.tar.gz
          if-no-files-found: error

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums and manifest
        run: |
          mkdir -p target/dist
          cp artifacts/*.tar.gz target/dist/
          python3 scripts/checksums.py target/dist
      - uses: actions/upload-artifact@v4
        with:
          name: sauron-release-manifest
          path: |
            target/dist/*.tar.gz
            target/dist/SHA256SUMS.txt
            target/dist/manifest.json
          if-no-files-found: error

  publish_release:
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sauron-release-manifest
          path: target/dist
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: SAUR-ON ${{ inputs.tag }}
          draft: true
          generate_release_notes: true
          files: |
            target/dist/*.tar.gz
            target/dist/SHA256SUMS.txt
            target/dist/manifest.json
