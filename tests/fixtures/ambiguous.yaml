# Deliberately ambiguous/colliding CRDs for M2 item 3 resource-resolution acceptance.
# Instances are in ambiguous-instances.yaml, applied only after these are Established
# (mirrors eyes.testing.sauron.local / eye.yaml). Never applied to production.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: portals.a.sauron.test
spec:
  group: a.sauron.test
  scope: Namespaced
  names:
    plural: portals
    singular: portal
    kind: Portal
    # Collides with the built-in "po" -> pods alias; discovery must warn, not silently
    # let this shadow pods or silently let pods shadow this.
    shortNames: [po]
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                destination: {type: string}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.a.sauron.test
spec:
  group: a.sauron.test
  scope: Namespaced
  names:
    plural: widgets
    singular: widget
    kind: Widget
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                color: {type: string}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  # Same plural AND kind as widgets.a.sauron.test above, different group: a genuine
  # cross-group collision an administrator can actually create.
  name: widgets.b.sauron.test
spec:
  group: b.sauron.test
  scope: Namespaced
  names:
    plural: widgets
    singular: widget
    kind: Widget
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                color: {type: string}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  # Cluster-scoped CRD to exercise the namespaced-vs-cluster-scoped UI path alongside
  # built-in cluster-scoped resources like nodes.
  name: probes.a.sauron.test
spec:
  group: a.sauron.test
  scope: Cluster
  names:
    plural: probes
    singular: probe
    kind: Probe
    shortNames: [pb]
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                target: {type: string}
